version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        USER_UID: ${UID}
        USER_GID: ${GID}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    network_mode: host
    volumes:
      - ./:/workspace
    working_dir: /workspace
    user: ${UID}:${GID}
    privileged: true
    stdin_open: true
    tty: true

