version: '3.9'

services:
   inference:
     build:
       context: ./Inference-Pinos/
       dockerfile: Dockerfile
     container_name: inference
     restart: unless-stopped
     deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: 1 # Number of GPUs to allocate (use 'all' for all GPUs)
               capabilities: [gpu]
  